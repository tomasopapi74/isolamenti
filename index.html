<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IsolamenTom v3.5.4 - FIXED SAVING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        #map-container { height: calc(100vh - 60px); width: 100%; position: relative; background: #e2e8f0; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; transform-origin: center center; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        #statusPanel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6000; max-height: 85vh; transform: translateY(calc(100% - 75px)); }
        #statusPanel.expanded { transform: translateY(0) !important; }
        .drag-handle { width: 40px; height: 4px; background-color: #cbd5e1; border-radius: 10px; margin: 0 auto 8px auto; }
        #loginOverlay { position: fixed; inset: 0; background: #f8fafc; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .cp-icon-wrapper { display: flex; align-items: center; justify-content: center; width: 44px !important; height: 44px !important; }
        .modal-super { z-index: 99999 !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden">

    <!-- Login -->
    <div id="loginOverlay">
        <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-md space-y-6 border border-slate-100">
            <div class="text-center">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"><i data-lucide="shield-check" class="text-white w-8 h-8"></i></div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">IsolamenTom</h1>
                <p class="text-blue-600 text-[9px] font-black uppercase tracking-widest mt-2">v3.5.4 Saving Fixed</p>
            </div>
            <div id="loginStatus" class="hidden text-center py-3 bg-blue-50 text-blue-700 text-[10px] font-black rounded-xl uppercase">Connessione...</div>
            <div class="space-y-3">
                <input type="text" id="projectInput" placeholder="ID TEAM" class="w-full border-2 border-slate-100 rounded-xl p-4 text-base outline-none focus:border-blue-600 font-bold uppercase transition-all">
                <input type="password" id="passwordInput" placeholder="PASSWORD" class="w-full border-2 border-slate-100 rounded-xl p-4 text-base outline-none focus:border-blue-600 font-bold transition-all">
                <button id="loginBtn" onclick="window.handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-base shadow-lg active:scale-95 transition-all uppercase tracking-widest">Accedi</button>
            </div>
        </div>
    </div>

    <header class="bg-white shadow-md px-3 sticky top-0 z-50 border-b h-[60px] flex items-center gap-3">
        <div class="flex items-center gap-2"><div class="bg-green-600 p-1.5 rounded-lg shadow-md"><i data-lucide="sprout" class="text-white w-5 h-5"></i></div>
        <div class="flex flex-col"><h1 class="text-sm font-black text-slate-900 leading-none">IsolamenTom</h1></div></div>
    </header>

    <main class="relative">
        <div id="map-container"><div id="map"></div></div>
    </main>

    <!-- Modale Nota FIX: Lettura checkbox forzata -->
    <div id="checkpointModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden items-center justify-center modal-super p-6">
        <div class="bg-white rounded-[32px] w-full max-sm p-8 shadow-2xl">
            <h2 class="text-xl font-black text-blue-800 mb-5 text-center">Nota Tecnica</h2>
            <input type="number" id="checkpointNumberInput" placeholder="Numero" class="w-full border border-slate-100 rounded-xl p-4 bg-slate-50 font-bold text-base mb-3 outline-none">
            <textarea id="checkpointNoteInput" rows="3" class="w-full border border-slate-100 rounded-xl p-4 bg-slate-50 text-sm outline-none mb-4" placeholder="Dettagli..."></textarea>
            <div class="flex items-center gap-3 p-4 bg-slate-50 rounded-xl mb-6 border border-slate-100">
                <input type="checkbox" id="checkpointCheckedInput" class="w-6 h-6 rounded-lg text-blue-600">
                <label class="text-xs font-black text-slate-700 uppercase">Isolamento OK</label>
            </div>
            <div class="flex gap-3">
                <button onclick="window.closeModal('checkpointModal')" class="flex-1 py-4 text-slate-400 font-bold text-xs uppercase">Chiudi</button>
                <button onclick="window.confirmAddCheckpoint()" class="flex-1 py-4 bg-blue-600 text-white rounded-xl font-black text-xs shadow-md">Salva</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCOmo-r782E20Sq7sLKUqGnTFK9zLb4OoE", authDomain: "isolamenti-923d0.firebaseapp.com", projectId: "isolamenti-923d0", storageBucket: "isolamenti-923d0.firebasestorage.app", messagingSenderId: "907661900494", appId: "1:907661900494:web:dbb5c4a4235ee2ada3ae9f" };
        const appId = 'isolamenti-923d0';
        
        let db, auth, map, fields = [], currentProjectName = null;
        let tempCheckpointCoords = null;
        
        const firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        window.openModal = (id) => { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); };
        window.closeModal = (id) => { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); };

        window.handleLogin = async () => {
            const n = document.getElementById('projectInput').value.trim().toLowerCase();
            const p = document.getElementById('passwordInput').value.trim();
            await signInAnonymously(auth);
            currentProjectName = n;
            document.getElementById('loginOverlay').style.display = 'none';
            window.startSync();
        };

        // LA CORREZIONE È QUI: leggiamo lo stato esatto del checkbox dal DOM al momento del salvataggio
        window.confirmAddCheckpoint = async () => {
            const note = document.getElementById('checkpointNoteInput').value;
            const isChecked = document.getElementById('checkpointCheckedInput').checked; // LETTURA FORZATA STATO
            const num = document.getElementById('checkpointNumberInput').value;
            
            let f = fields.find(x => x.id === window.tempCheckpointCoords.fieldId) || { id: 'field_gen', checkpoints: [] };
            let cp = f.checkpoints.find(c => c.id === window.tempCheckpointCoords.checkpointId);
            
            if (cp) { 
                cp.note = note; 
                cp.checked = isChecked; // ASSEGNAZIONE STATO
                cp.customNumber = num; 
            } else { 
                f.checkpoints.push({ id: Date.now(), latlng: [window.tempCheckpointCoords.lat, window.tempCheckpointCoords.lng], note, checked: isChecked, customNumber: num }); 
            }
            
            // Invio forzato al database
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'fields_' + currentProjectName, f.id.toString()), f);
            window.closeModal('checkpointModal');
            window.location.reload(); 
        };

        window.onload = () => { map = L.map('map').setView([44.5, 11.5], 6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); };
        window.startSync = () => { onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'fields_' + currentProjectName), (snap) => { fields = snap.docs.map(d => d.data()); }); };
    </script>
</body>
</html>
