<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IsolamenTom v3.5.5 - FULL RECOVERY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        #map-container { height: calc(100vh - 60px); width: 100%; position: relative; background: #e2e8f0; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; transform-origin: center center; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        #statusPanel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6000; max-height: 85vh; transform: translateY(calc(100% - 75px)); }
        #statusPanel.expanded { transform: translateY(0) !important; }
        .drag-handle { width: 40px; height: 4px; background-color: #cbd5e1; border-radius: 10px; margin: 0 auto 8px auto; }
        #loginOverlay { position: fixed; inset: 0; background: #f8fafc; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .cp-icon-wrapper { display: flex; align-items: center; justify-content: center; width: 44px !important; height: 44px !important; }
        .modal-super { z-index: 99999 !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden">

    <!-- Login -->
    <div id="loginOverlay">
        <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-md space-y-6 border border-slate-100">
            <div class="text-center">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"><i data-lucide="shield-check" class="text-white w-8 h-8"></i></div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">IsolamenTom</h1>
                <p class="text-blue-600 text-[9px] font-black uppercase tracking-widest mt-2">v3.5.5 Full Recovery</p>
            </div>
            <div id="loginStatus" class="hidden text-center py-3 bg-blue-50 text-blue-700 text-[10px] font-black rounded-xl uppercase">Connessione...</div>
            <div class="space-y-3">
                <input type="text" id="projectInput" placeholder="ID TEAM" class="w-full border-2 border-slate-100 rounded-xl p-4 text-base outline-none focus:border-blue-600 font-bold uppercase transition-all">
                <input type="password" id="passwordInput" placeholder="PASSWORD" class="w-full border-2 border-slate-100 rounded-xl p-4 text-base outline-none focus:border-blue-600 font-bold transition-all">
                <button id="loginBtn" onclick="window.handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-base shadow-lg active:scale-95 transition-all uppercase tracking-widest">Accedi</button>
            </div>
        </div>
    </div>

    <!-- Admin Console -->
    <div id="adminConsole" class="hidden modal-super">
        <div class="w-full max-w-4xl mx-auto space-y-6 pb-12 p-6 bg-slate-50 min-h-screen">
            <div class="flex items-center justify-between pt-4">
                <h2 class="text-xl font-black text-slate-800 uppercase">Team Control</h2>
                <button onclick="window.closeModal('adminConsole')" class="bg-white p-2 rounded-xl border shadow-sm active:scale-90"><i data-lucide="x"></i></button>
            </div>
            <div id="adminTeamList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <header class="bg-white shadow-md px-3 sticky top-0 z-50 border-b h-[60px] flex items-center gap-3">
        <div class="flex items-center gap-2">
            <div class="bg-green-600 p-1.5 rounded-lg shadow-md"><i data-lucide="sprout" class="text-white w-5 h-5"></i></div>
            <div class="flex flex-col"><h1 class="text-sm font-black text-slate-900 leading-none">IsolamenTom</h1></div>
        </div>
        <div class="flex-1"></div>
        <button onclick="window.logoutProject()" class="bg-slate-50 text-slate-400 p-2 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </header>

    <main class="relative">
        <div id="map-container"><div id="map"></div></div>
        
        <div class="absolute top-3 left-3 z-[1000] flex flex-col gap-2">
            <button onclick="window.recenterOnUser()" class="bg-white p-3 rounded-xl shadow-lg border border-slate-50"><i data-lucide="crosshair" class="w-5 h-5"></i></button>
            <button id="rotationToggle" onclick="window.toggleMapRotation()" class="bg-white p-3 rounded-xl shadow-lg border border-slate-50"><i data-lucide="compass" class="w-5 h-5"></i></button>
        </div>

        <div id="statusPanel" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.1)] rounded-t-[32px] flex flex-col border-t border-slate-100">
            <div id="dragArea" class="cursor-pointer p-4 pb-2" onclick="window.togglePanel()">
                <div class="drag-handle"></div>
                <div class="flex items-center justify-between px-2">
                    <span class="text-[10px] font-black uppercase text-slate-800">Dashboard</span>
                </div>
            </div>
            <div id="panelContent" class="space-y-4 overflow-y-auto px-5 pb-10 transition-opacity duration-300 h-[70vh]">
                <div id="adminTools" class="hidden p-4 bg-red-50 rounded-2xl border border-red-200">
                    <button onclick="window.openAdminConsole()" class="w-full bg-red-600 text-white py-3 rounded-xl font-black text-[10px] uppercase shadow-lg">Console Admin</button>
                </div>
                <button id="trackBtn" onclick="window.toggleTracking()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-base uppercase">AVVIA GPS</button>
                <div id="fieldsSection" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- Modali -->
    <div id="actionChoiceModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden items-center justify-center modal-super p-6">
        <div class="bg-white rounded-[40px] w-full max-w-xs p-8 text-center shadow-2xl">
            <button onclick="window.selectNewFieldAction()" class="w-full bg-green-50 text-green-700 p-6 rounded-[24px] font-black uppercase text-xs mb-3">Crea Isolamento</button>
            <button onclick="window.selectNewCheckpoint()" class="w-full bg-blue-50 text-blue-700 p-6 rounded-[24px] font-black uppercase text-xs">Aggiungi Nota</button>
        </div>
    </div>

    <!-- Modale Nota FIX: Lettura checkbox forzata -->
    <div id="checkpointModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden items-center justify-center modal-super p-6">
        <div class="bg-white rounded-[32px] w-full max-sm p-8 shadow-2xl">
            <h2 class="text-xl font-black text-blue-800 mb-5 text-center">Nota</h2>
            <input type="number" id="checkpointNumberInput" placeholder="Numero" class="w-full border p-4 bg-slate-50 font-bold rounded-xl mb-3">
            <textarea id="checkpointNoteInput" rows="3" class="w-full border p-4 bg-slate-50 rounded-xl mb-4"></textarea>
            <div class="flex items-center gap-3 p-4 bg-slate-50 rounded-xl mb-6 border">
                <input type="checkbox" id="checkpointCheckedInput" class="w-6 h-6">
                <label class="text-xs font-black uppercase">Isolamento OK</label>
            </div>
            <button onclick="window.confirmAddCheckpoint()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-xs">Salva</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCOmo-r782E20Sq7sLKUqGnTFK9zLb4OoE", authDomain: "isolamenti-923d0.firebaseapp.com", projectId: "isolamenti-923d0", storageBucket: "isolamenti-923d0.firebasestorage.app", messagingSenderId: "907661900494", appId: "1:907661900494:web:dbb5c4a4235ee2ada3ae9f" };
        const appId = 'isolamenti-923d0';
        const categoryColors = { cipolle: '#f97316', bunching: '#22c55e', brassiche: '#a855f7', altro: '#64748b' };
        
        let db, auth, map, fields = [], currentProjectName = null, isTracking = false, userMarker;
        const firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        window.handleLogin = async () => {
            const n = document.getElementById('projectInput').value.trim().toLowerCase();
            const p = document.getElementById('passwordInput').value.trim();
            await signInAnonymously(auth);
            currentProjectName = n;
            document.getElementById('loginOverlay').style.display = 'none';
            if(n === 'admin' && p === 'master25') document.getElementById('adminTools').classList.remove('hidden');
            window.startSync();
        };

        window.confirmAddCheckpoint = async () => {
            // CORREZIONE CRITICA: Leggiamo esplicitamente il valore della checkbox dal DOM
            const note = document.getElementById('checkpointNoteInput').value;
            const isChecked = document.getElementById('checkpointCheckedInput').checked; 
            const num = document.getElementById('checkpointNumberInput').value;
            
            let f = fields.find(x => x.id === window.tempCheckpointCoords.fieldId) || { id: 'field_gen', checkpoints: [] };
            let cp = f.checkpoints.find(c => c.id === window.tempCheckpointCoords.checkpointId);
            
            if (cp) { 
                cp.note = note; 
                cp.checked = isChecked; 
                cp.customNumber = num; 
            } else { 
                f.checkpoints.push({ id: Date.now(), latlng: [window.tempCheckpointCoords.lat, window.tempCheckpointCoords.lng], note, checked: isChecked, customNumber: num }); 
            }
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'fields_' + currentProjectName, f.id.toString()), f);
            window.location.reload();
        };

        window.toggleTracking = () => {
            if (isTracking) { isTracking = false; return; }
            isTracking = true;
            navigator.geolocation.watchPosition((pos) => {
                const ll = [pos.coords.latitude, pos.coords.longitude];
                if (!userMarker) userMarker = L.marker(ll).addTo(map);
                else userMarker.setLatLng(ll);
                map.panTo(ll);
            }, null, { enableHighAccuracy: true });
        };

        window.onload = () => { map = L.map('map').setView([44.5, 11.5], 6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); map.on('click', (e) => { window.tempFieldCoords = e.latlng; window.openModal('actionChoiceModal'); }); };
        window.startSync = () => { onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'fields_' + currentProjectName), (snap) => { fields = snap.docs.map(d => d.data()); }); };
    </script>
</body>
</html>
